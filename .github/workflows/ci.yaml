name: "MedQuAD Quality Gates & Safety CI"

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-safety-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Project Dependencies
        run: |
          uv sync --frozen

      - name: "Quality Gate 1: Code Linting & Style"
        run: |
          uv run ruff check .

      - name: "Quality Gate 2: Safe Refusal Scope Lock & Model Armor Guardrails"
        run: |
          uv run pytest tests/unit/test_scope_lock.py tests/unit/test_model_armor.py

      - name: "Quality Gate 3: Unit Test Suite (Supervisor-Worker & MCP)"
        run: |
          uv run pytest tests/unit
